# stock-asm: /etc/nginx/sites-available/agrostma (symlinked into sites-enabled).
# Django (gunicorn) on 127.0.0.1:8000, Next.js on 127.0.0.1:3000, both behind one origin.
# X-Forwarded-For is overwritten with the one real client IP: Django's login and quote throttles trust it.

# Office network: the whole app, plain http at http://192.168.1.69 (ufw allows 80 from the LAN only).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 25m;  # product photo uploads

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;  # matches gunicorn --timeout

    location /static/   { alias /srv/agrostma/app/backend/staticfiles/; }
    # Photos uploaded after the last build: Next only knows the files it was built with.
    location /products/ { root /srv/agrostma/app/frontend/public; }
    location /api/      { proxy_pass http://127.0.0.1:8000; }
    location /admin/    { proxy_pass http://127.0.0.1:8000; }
    location /          { proxy_pass http://127.0.0.1:3000; }
}

# Public site: only cloudflared reaches this (localhost), for agrostma.com through the Cloudflare tunnel.
# Staff pages and every API endpoint the public pages don't call are closed here; the server-rendered
# public pages fetch Django directly, not through nginx.
server {
    listen 127.0.0.1:8081;
    server_name agrostma.com www.agrostma.com;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location /products/ { root /srv/agrostma/app/frontend/public; }

    location ~ ^/(ventas|comisiones|corte-de-caja|facturas|rentabilidad|solicitudes|usuarios|fotos|login|admin)(/|$) {
        return 404;
    }

    location = /api/auth/me/   { proxy_pass http://127.0.0.1:8000; }
    location = /api/solicitudes/ {  # the cart's quote request
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/gea-parts/   { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8000; }
    location /api/inventory/   { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8000; }
    location /api/             { return 404; }

    location / { proxy_pass http://127.0.0.1:3000; }
}
